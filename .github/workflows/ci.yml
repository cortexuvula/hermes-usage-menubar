name: CI

on:
  push:
    branches: [main, "fix/**"]
  pull_request:

jobs:
  test:
    name: Build & test (macOS)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app

      # Compiles and runs the fixture-based contract/lifecycle suites.
      # No real Hermes home is needed: tests use a scripted executor and
      # synthetic python subprocesses. Nothing installs into ~/Applications
      # and nothing mutates the repository — the runner asserts a clean
      # git tree after packaging.
      - name: Run tests (suite + bundle validation + clean-tree assertion)
        run: ./Tests/run-tests.sh

      # Second packaging pass driven directly by CI: collector files are
      # seeded from the tracked copies (no upstream checkout on the runner);
      # build output AND install are redirected outside the repo.
      - name: Package app bundle (no install, no repo mutation)
        env:
          COLLECTOR_SRC: ${{ github.workspace }}/.ci-collector
          HERMES_USAGE_BUILD_DIR: ${{ runner.temp }}/pkg
          HERMES_USAGE_INSTALL_DIR: ${{ runner.temp }}/apps
        run: |
          mkdir -p .ci-collector/collector .ci-collector/hermes-usage-export
          cp build/HermesUsage.app/Contents/Resources/collector/hermes-usage.py .ci-collector/collector/
          cp build/HermesUsage.app/Contents/Resources/hermes-usage-export/quota_io.py .ci-collector/hermes-usage-export/
          # build.sh self-validates: plutil -lint + codesign --deep --strict
          # fail the run on a malformed bundle (R4 rework).
          ./build.sh
          plutil -lint "$RUNNER_TEMP/pkg/HermesUsage.app/Contents/Info.plist"
          codesign --verify --deep --strict --verbose=2 "$RUNNER_TEMP/pkg/HermesUsage.app"
          test -x "$RUNNER_TEMP/pkg/HermesUsage.app/Contents/MacOS/HermesUsage"
          test -d "$RUNNER_TEMP/apps/HermesUsage.app" || { echo "redirected install missing"; exit 1; }
          if [ -n "$(git status --porcelain)" ]; then
            echo "FAIL: CI run mutated the repository:"; git status --porcelain; exit 1
          fi
          echo "packaged + validated OK (repo clean, nothing installed to ~/Applications)"
