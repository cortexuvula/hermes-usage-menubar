name: CI

on:
  # No branch filter on push: CI runs on every pushed branch. History:
  # merge/** branches sailed through unbuilt, then a docs/** push did the
  # same — each enumerated pattern left a silent coverage hole for the next
  # unanticipated branch name. The filter's failure mode is silent absence
  # of coverage; runner minutes on stray refs are cheaper than that.
  push:
  pull_request:

jobs:
  test:
    name: Build & test (macOS)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app

      # Deterministic Python for make_icon.py (Pillow). The runner's system
      # Python has no Pillow and is externally managed — use a pinned
      # setup-python interpreter instead of depending on runner images.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Pillow (icon generation)
        run: python3 -m pip install pillow

      # Compiles and runs the fixture-based contract/lifecycle suites.
      # No real Hermes home is needed: tests use a scripted executor and
      # synthetic python subprocesses. Nothing installs into ~/Applications
      # and nothing mutates the repository — the runner asserts a clean
      # git tree after packaging.
      - name: Run tests (suite + bundle validation + clean-tree assertion)
        run: ./Tests/run-tests.sh

      # Second packaging pass driven directly by CI: collector files are
      # seeded from the tracked copies (no upstream checkout on the runner);
      # build output AND install are redirected outside the repo.
      - name: Package app bundle (no install, no repo mutation)
        env:
          COLLECTOR_SRC: ${{ runner.temp }}/.ci-collector
          HERMES_USAGE_BUILD_DIR: ${{ runner.temp }}/pkg
          HERMES_USAGE_INSTALL_DIR: ${{ runner.temp }}/apps
        run: |
          # Stage the collector copies OUTSIDE the workspace so the
          # clean-tree assertion below only guards genuine mutations
          # (the first run tripped it on its own untracked staging dir).
          mkdir -p "$RUNNER_TEMP/.ci-collector/collector" "$RUNNER_TEMP/.ci-collector/hermes-usage-export"
          cp build/HermesUsage.app/Contents/Resources/collector/hermes-usage.py "$RUNNER_TEMP/.ci-collector/collector/"
          cp build/HermesUsage.app/Contents/Resources/hermes-usage-export/quota_io.py "$RUNNER_TEMP/.ci-collector/hermes-usage-export/"
          # build.sh self-validates: plutil -lint + codesign --deep --strict
          # fail the run on a malformed bundle (R4 rework).
          ./build.sh
          plutil -lint "$RUNNER_TEMP/pkg/HermesUsage.app/Contents/Info.plist"
          # t_b2280a32: CI builds are untagged; the bundle must never claim
          # a release version by default (the 1.0.0 hardcode this fixes).
          CI_SHORT="$(plutil -extract CFBundleShortVersionString raw "$RUNNER_TEMP/pkg/HermesUsage.app/Contents/Info.plist")"
          [ "$CI_SHORT" = "0.0.0" ] || { echo "FAIL: CI build claims version $CI_SHORT, expected 0.0.0"; exit 1; }
          codesign --verify --deep --strict --verbose=2 "$RUNNER_TEMP/pkg/HermesUsage.app"
          test -x "$RUNNER_TEMP/pkg/HermesUsage.app/Contents/MacOS/HermesUsage"
          test -d "$RUNNER_TEMP/apps/HermesUsage.app" || { echo "redirected install missing"; exit 1; }
          if [ -n "$(git status --porcelain)" ]; then
            echo "FAIL: CI run mutated the repository:"; git status --porcelain; exit 1
          fi
          echo "packaged + validated OK (repo clean, nothing installed to ~/Applications)"
