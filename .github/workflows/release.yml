name: Release (signed build)

# repo-auditor constraint 1: the release job must NEVER be reachable from a
# pull_request event, and must share no workflow file with the untrusted
# PR/push test path (ci.yml has no secrets). Tag push or manual dispatch
# only — same-repo branch pushes are performed by us, forks cannot reach
# this workflow, and pull_request is deliberately absent.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      # Non-publishing probe path (t_b2280a32): dispatch builds the app with
      # an EXPLICIT version so the plist stamping can be verified without
      # tagging a test release. Empty input = build.sh untagged defaults
      # (0.0.0 + monotonic build number — never a release claim).
      version:
        description: "Version to stamp (X.Y.Z); empty = untagged defaults (0.0.0)"
        required: false
        default: ""

permissions:
  contents: write  # tag pushes create a GitHub Release

jobs:
  sign-and-verify:
    name: Signed build + verification evidence
    # Only trusted runners: no fork PRs can ever reach this job (see trigger).
    runs-on: macos-latest
    env:
      APP_NAME: HermesUsage.app
      BUNDLE_ID: ca.andrehugo.hermes-usage
    steps:
      - uses: actions/checkout@v5

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Pillow (icon generation)
        run: python3 -m pip install pillow

      # ---- Import signing identity into a throwaway keychain -------------
      # Constraint 2: these steps exist ONLY in this trusted job. ci.yml
      # never references any signing secret.
      - name: Import Developer ID certificate
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
        run: |
          set -euo pipefail
          # (set -x removed: the hang it was added to diagnose is solved;
          #  keeping it would echo secret-bearing command lines to the log.)
          KEYCHAIN=build.keychain
          KEYCHAIN_PATH="$RUNNER_TEMP/$KEYCHAIN"
          CERT_P12="$RUNNER_TEMP/build_certificate.p12"

          # BSD base64 (macOS) has no -o; decode to stdout and redirect.
          printf '%s' "$BUILD_CERTIFICATE_BASE64" | base64 --decode > "$CERT_P12"
          ls -la "$CERT_P12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          # Auto-lock after 6h, no lock on sleep — avoids codesign hanging on
          # a locked keychain mid-build.
          security set-keychain-settings -lut 21600 -nc "$KEYCHAIN_PATH" 2>/dev/null || \
            security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          # APPEND the build keychain to the search list (do NOT replace the
          # list — replacing it hides login.keychain and makes later security
          # calls hang waiting on UI that never comes on a headless runner).
          security list-keychain -d user >> /dev/null
          CURRENT_LIST=$(security list-keychain -d user | tr -d '"' | tr '\n' ' ')
          security list-keychain -d user -s $CURRENT_LIST "$KEYCHAIN_PATH"
          # The P12 is legacy-encoded (pbeWithSHA1And40BitRC2-CBC, the
          # pre-2010 default). macOS 26's 'security import' silently hangs
          # on it, and Homebrew OpenSSL 3 refuses RC2 without the legacy
          # provider. The macOS SYSTEM /usr/bin/openssl is LibreSSL, which
          # reads legacy P12s natively — prefer it; fall back to
          # 'openssl -legacy' if the system binary is unavailable.
          # Passwords reach openssl via file descriptors (passin/passout fd:),
          # not argv — argv is ps-visible during the process window. The
          # security(1) calls below have no stdin/fd form and stay as-is.
          OSSL=/usr/bin/openssl
          if ! "$OSSL" pkcs12 -in "$CERT_P12" -passin fd:3 \
              -nokeys -nocerts -info >/dev/null 2>/tmp/openssl-probe.log \
              3< <(printf '%s' "$P12_PASSWORD"); then
            echo "system openssl probe failed; trying openssl -legacy"
            cat /tmp/openssl-probe.log
            OSSL="openssl -legacy"
          fi
          $OSSL pkcs12 -in "$CERT_P12" -passin fd:3 -passout fd:4 \
            -out "$RUNNER_TEMP/combined.pem" 2>/tmp/openssl.log \
            3< <(printf '%s' "$P12_PASSWORD") \
            4< <(printf '%s' "$KEYCHAIN_PASSWORD") \
            || { echo "::error::openssl pkcs12 extraction failed:"; cat /tmp/openssl.log; exit 1; }
          $OSSL pkcs12 -in "$CERT_P12" -passin fd:3 \
            -nokeys -out "$RUNNER_TEMP/cert.pem" 2>>/tmp/openssl.log \
            3< <(printf '%s' "$P12_PASSWORD") \
            || { echo "::error::openssl cert extraction failed:"; cat /tmp/openssl.log; exit 1; }
          # Key alone: -nocerts avoids the duplicate-cert collision entirely.
          $OSSL pkcs12 -in "$CERT_P12" -passin fd:3 -passout fd:4 \
            -nocerts -out "$RUNNER_TEMP/key.pem" 2>>/tmp/openssl.log \
            3< <(printf '%s' "$P12_PASSWORD") \
            4< <(printf '%s' "$KEYCHAIN_PASSWORD") \
            || { echo "::error::openssl key extraction failed:"; cat /tmp/openssl.log; exit 1; }
          ls -la "$RUNNER_TEMP"/*.pem
          # Import certificates first, then the key from the combined PEM.
          # The combined PEM re-contains the certs, so 'already exists' is
          # EXPECTED — tolerate it (the private key still imports) and let
          # the find-identity gate below prove the identity is complete.
          security import "$RUNNER_TEMP/cert.pem" -k "$KEYCHAIN_PATH" -T /usr/bin/codesign
          # Key separately (no certs inside → no duplicate collision).
          security import "$RUNNER_TEMP/key.pem" -k "$KEYCHAIN_PATH" \
            -P "$KEYCHAIN_PASSWORD" -T /usr/bin/codesign
          rm -f "$RUNNER_TEMP/combined.pem" "$RUNNER_TEMP/cert.pem" "$RUNNER_TEMP/key.pem"
          # Partition list MUST come after import and must use the keychain
          # password; run with the keychain as the final arg (partition-list
          # can block on UI if the keychain is not yet in the search list).
          security set-key-partition-list -S apple-tool:,apple: -s \
            -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          # Fail loudly if the identity is not actually usable.
          security find-identity -v -p codesigning "$KEYCHAIN_PATH" | tee /tmp/identities.txt
          grep -qE "^\s*1 valid identities found" /tmp/identities.txt \
            || { echo "::error::expected exactly 1 codesigning identity, got the above"; exit 1; }
          # Exact-equality identity check: extract the quoted name from the
          # numbered find-identity line and compare strings. A substring
          # grep (even -qF) would accept "…(RB4QV9W52C) EXTRA" — proven by
          # fixture test; this form rejects it.
          ACTUAL_IDENTITY=$(sed -nE \
            's/^[[:space:]]*[0-9]+\)[[:space:]]+[A-F0-9]+[[:space:]]+"(.*)"$/\1/p' \
            /tmp/identities.txt | head -1)
          if [ "$ACTUAL_IDENTITY" != "$APPLE_SIGNING_IDENTITY" ]; then
            echo "::error::identity mismatch. expected: [$APPLE_SIGNING_IDENTITY] actual: [$ACTUAL_IDENTITY]"
            exit 1
          fi
          rm -f "$CERT_P12"

      - name: Build with hardened runtime + Developer ID signature
        env:
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          COLLECTOR_SRC: ${{ runner.temp }}/.ci-collector
          HERMES_USAGE_BUILD_DIR: ${{ runner.temp }}/pkg
          HERMES_USAGE_INSTALL_DIR: ${{ runner.temp }}/apps
          # Env, not inline interpolation: keeps the dispatch input out of the
          # shell script text (no expansion into the command stream).
          DISPATCH_VERSION: ${{ github.event.inputs.version }}
        run: |
          set -euo pipefail
          # Stage collector copies outside the workspace (clean-tree rule).
          mkdir -p "$RUNNER_TEMP/.ci-collector/collector" "$RUNNER_TEMP/.ci-collector/hermes-usage-export"
          cp build/HermesUsage.app/Contents/Resources/collector/hermes-usage.py "$RUNNER_TEMP/.ci-collector/collector/"
          cp build/HermesUsage.app/Contents/Resources/hermes-usage-export/quota_io.py "$RUNNER_TEMP/.ci-collector/hermes-usage-export/"

          # Version context (t_b2280a32): the bundle self-identifies as the
          # release being built. Tag push: strip the leading v and stamp the
          # tag's version; build iteration is the CI run number (monotonic).
          # workflow_dispatch: stamp the requested input (probe path, never
          # publishes). Anything else (branch push reaching this workflow in
          # the future) falls through to build.sh's untagged defaults.
          VERSION_ARGS=()
          if [ "$GITHUB_EVENT_NAME" = "push" ] && [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            TAG_VERSION="${GITHUB_REF_NAME#v}"
            VERSION_ARGS=("$TAG_VERSION" "$GITHUB_RUN_NUMBER")
          elif [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ] && [ -n "${DISPATCH_VERSION:-}" ]; then
            VERSION_ARGS=("$DISPATCH_VERSION" "$GITHUB_RUN_NUMBER")
          fi
          if [ ${#VERSION_ARGS[@]} -gt 0 ]; then
            echo "stamping release context: version=${VERSION_ARGS[0]} build=$GITHUB_RUN_NUMBER"
          else
            echo "no release context: build.sh untagged defaults apply (0.0.0 + derived build number)"
          fi

          # build.sh ad-hoc signs; we overwrite with the real signature
          # immediately after, then gate on verification of the FINAL
          # artifact (constraint 4). build.sh validates the version format
          # and asserts the plist readback BEFORE its ad-hoc signature, so
          # an invalid value can never reach a signed artifact.
          ./build.sh "${VERSION_ARGS[@]}"

          APP="$RUNNER_TEMP/pkg/HermesUsage.app"
          codesign --force --deep --sign "$APPLE_SIGNING_IDENTITY" \
            --options runtime --timestamp "$APP"

      # ---- Constraint 3: notarization is a REAL step ---------------------
      # Two explicitly separate paths:
      #   credentials ABSENT  -> skip notarization, label signed-only loudly,
      #                          release gate stays closed. Run may be green.
      #   credentials PRESENT -> notarytool/stapler run with NO
      #                          continue-on-error: a genuine Apple rejection
      #                          FAILS the job. Never silently swallowed.
      - name: Detect notarization route
        id: notary_route
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_API_KEY_CONTENT: ${{ secrets.APPLE_API_KEY_CONTENT }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          set -euo pipefail
          if [ -n "${APPLE_API_KEY_CONTENT:-}" ] && [ -n "${APPLE_API_KEY_ID:-}" ] && [ -n "${APPLE_API_ISSUER:-}" ]; then
            echo "route=key" >> "$GITHUB_OUTPUT"
          elif [ -n "${APPLE_ID:-}" ] && [ -n "${APPLE_APP_SPECIFIC_PASSWORD:-}" ]; then
            echo "route=appleid" >> "$GITHUB_OUTPUT"
          else
            echo "route=none" >> "$GITHUB_OUTPUT"
          fi

      - name: Notarize + staple
        id: notarize
        if: steps.notary_route.outputs.route != 'none'
        env:
          ROUTE: ${{ steps.notary_route.outputs.route }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_API_KEY_CONTENT: ${{ secrets.APPLE_API_KEY_CONTENT }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          APP="$RUNNER_TEMP/pkg/HermesUsage.app"
          ditto -c -k --keepParent "$APP" "$RUNNER_TEMP/notarize-submit.zip"

          if [ "$ROUTE" = "key" ]; then
            # Preferred long-term route once the .p8 content secret exists.
            KEYFILE="$RUNNER_TEMP/AuthKey_${APPLE_API_KEY_ID}.p8"
            printf '%s' "$APPLE_API_KEY_CONTENT" > "$KEYFILE"
            xcrun notarytool submit "$RUNNER_TEMP/notarize-submit.zip" \
              --key "$KEYFILE" --key-id "$APPLE_API_KEY_ID" --issuer "$APPLE_API_ISSUER" --wait
            rm -f "$KEYFILE"
          else
            # Apple-ID route (active today). notarytool has NO env-var form
            # for the app-specific password (verified: zero occurrences of
            # NOTARYTOOL_PASSWORD in the binary) — but its secure prompt
            # reads from a pipe when stdin is not a TTY. Piping the password
            # keeps it out of both argv and the process environment; the
            # submit then uses only the stored keychain profile.
            # (store-credentials has no --force; the build keychain is
            # created fresh each run, so the profile cannot collide.)
            printf '%s' "$APPLE_APP_SPECIFIC_PASSWORD" | \
              xcrun notarytool store-credentials HERMES_NOTARY \
                --apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" \
                --keychain "$RUNNER_TEMP/build.keychain"
            xcrun notarytool submit "$RUNNER_TEMP/notarize-submit.zip" \
              --keychain-profile HERMES_NOTARY \
              --keychain "$RUNNER_TEMP/build.keychain" --wait
          fi

          xcrun stapler staple "$APP"
          xcrun stapler validate "$APP"
          echo "NOTARIZED=yes" >> "$GITHUB_ENV"
          echo "STAPLED=yes" >> "$GITHUB_ENV"

      - name: Signed-only notice (notarization credentials absent)
        if: steps.notary_route.outputs.route == 'none'
        run: |
          {
            echo "## ⚠️ SIGNED-ONLY ARTIFACT — NOT NOTARIZED"
            echo ""
            echo "This build is Developer ID signed but NOT notarized (no notarization credentials configured)."
            echo "It MUST NOT be distributed as a release. The release gate remains closed."
          } >> "$GITHUB_STEP_SUMMARY"
          echo "::warning::notarization credentials absent — artifact is SIGNED-ONLY and must not be presented as a release"

      # ---- Constraint 4: verify the FINAL distributed artifact ------------
      - name: Verify final artifact (post-sign evidence)
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          APP="$RUNNER_TEMP/pkg/HermesUsage.app"

          echo "== codesign --verify --deep --strict =="
          codesign --verify --deep --strict --verbose=2 "$APP"

          echo "== embedded signature details =="
          codesign -dvv "$APP" 2>&1 | tee /tmp/codesign-dvv.txt
          grep -q "TeamIdentifier=$APPLE_TEAM_ID" /tmp/codesign-dvv.txt \
            || { echo "::error::TeamIdentifier mismatch"; exit 1; }

          echo "== authority chain =="
          codesign -d --extract-certificates "$APP" 2>/dev/null || true
          security find-certificate -a -p "$RUNNER_TEMP/build.keychain" > /tmp/keychain-certs.pem || true
          # Print the chain from the detached requirements for the record.
          codesign -d --verbose=4 "$APP" 2>&1 | grep -E "Authority|TeamIdentifier|Identifier=" | tee /tmp/chain.txt
          grep -q "Developer ID Application" /tmp/chain.txt \
            || { echo "::error::authority chain missing Developer ID Application"; exit 1; }
          grep -q "Developer ID Certification Authority" /tmp/chain.txt \
            || { echo "::error::authority chain missing Developer ID CA"; exit 1; }

          echo "== hardening check (runtime flag in code directory) =="
          codesign -d --verbose=4 "$APP" 2>&1 | grep -q "runtime" \
            || echo "::warning::runtime flag not reported by codesign -d (check flags=0x10000)"

          echo "== spctl assess =="
          # Gatekeeper assessment. Signed-but-NOT-notarized is EXPECTED to be
          # rejected here; we capture the output as evidence and label the
          # artifact accordingly.
          # NOTE: spctl assesses the STAPLED ticket when one is present
          # ("source=Notarized Developer ID" requires it). Running spctl
          # BEFORE the separate stapler-validate step is intentional: each
          # independently proves the final artifact — Gatekeeper's verdict
          # and the staple's own validity check. Don't reorder.
          set +e
          spctl -a -vv "$APP" 2>&1 | tee /tmp/spctl.txt
          SPCTL_RC=${PIPESTATUS[0]}
          set -e
          cat /tmp/spctl.txt
          if [ "$SPCTL_RC" -eq 0 ]; then
            echo "SPCTL_ASSESS=accepted" >> "$GITHUB_ENV"
          else
            echo "SPCTL_ASSESS=rejected" >> "$GITHUB_ENV"
          fi

      - name: Staple validation (final-artifact evidence)
        if: steps.notarize.outcome == 'success'
        run: |
          set -euo pipefail
          APP="$RUNNER_TEMP/pkg/HermesUsage.app"
          xcrun stapler validate "$APP"

      # ---- Release gate (constraint 3 + 4) ---------------------------------
      - name: Enforce release gate
        if: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') }}
        run: |
          set -euo pipefail
          if [ "${SPCTL_ASSESS:-rejected}" != "accepted" ] || [ "${STAPLED:-no}" != "yes" ]; then
            echo "::error::RELEASE BLOCKED: a tag push demands a notarized + stapled + spctl-accepted artifact. Current: spctl=${SPCTL_ASSESS:-rejected} stapled=${STAPLED:-no}. Produce the .p8 notarization key first."
            exit 1
          fi
          # Version identity gate (t_b2280a32): the artifact this tag is about
          # to publish must self-declare the tag's version. Split per Apple's
          # documented intent (verified against developer.apple.com):
          # CFBundleShortVersionString = marketing version = the tag (v1.1.0
          # -> 1.1.0); CFBundleVersion = monotonic build iteration = the CI
          # run number. Checks the FINAL (notarized+stapled) artifact, after
          # every step that could have rewritten the bundle.
          APP="$RUNNER_TEMP/pkg/HermesUsage.app"
          EXPECTED_SHORT="${GITHUB_REF_NAME#v}"
          PLIST_SHORT="$(plutil -extract CFBundleShortVersionString raw "$APP/Contents/Info.plist")"
          PLIST_BUILD="$(plutil -extract CFBundleVersion raw "$APP/Contents/Info.plist")"
          if [ "$PLIST_SHORT" != "$EXPECTED_SHORT" ]; then
            echo "::error::RELEASE BLOCKED: version identity mismatch. tag=$EXPECTED_SHORT, CFBundleShortVersionString=$PLIST_SHORT — the published asset must self-identify as the tag."
            exit 1
          fi
          if [ "$PLIST_BUILD" != "$GITHUB_RUN_NUMBER" ]; then
            echo "::error::RELEASE BLOCKED: build iteration mismatch. expected CI run number=$GITHUB_RUN_NUMBER, CFBundleVersion=$PLIST_BUILD."
            exit 1
          fi
          echo "Version identity gate passed: tag=$EXPECTED_SHORT, plist short=$PLIST_SHORT, build=$PLIST_BUILD."
          echo "Release gate passed: notarized, stapled, spctl accepted, version matches tag."

      - name: Zip and label artifact
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/pkg"
          LABEL="signed-only-NOT-NOTARIZED"
          if [ "${STAPLED:-no}" = "yes" ] && [ "${NOTARIZED:-no}" = "yes" ]; then LABEL="notarized-stapled"; fi
          ditto -c -k --keepParent HermesUsage.app "HermesUsage-${LABEL}.zip"
          echo "ARTIFACT_LABEL=$LABEL" >> "$GITHUB_ENV"
          ls -la

      - uses: actions/upload-artifact@v4
        with:
          name: HermesUsage-${{ env.ARTIFACT_LABEL }}
          path: ${{ runner.temp }}/pkg/HermesUsage-${{ env.ARTIFACT_LABEL }}.zip
          if-no-files-found: error
          retention-days: 14

      # ---- Publish GitHub Release on tag pushes ---------------------------
      # The release gate above already hard-failed unless the artifact is
      # notarized + stapled + spctl-accepted, so reaching this step on a
      # tag push means the asset is distribution-grade. Non-tag runs
      # (workflow_dispatch) never publish.
      - name: Publish GitHub Release (tag pushes only)
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          # --verify-tag only proves the tag exists remotely; provenance needs
          # the remote tag to resolve to the exact commit this run checked out
          # and built (guards against a force-moved tag). Annotated tags
          # advertise a tag-OBJECT sha on the direct ref, so query the peeled
          # entry too and prefer it; lightweight tags have no peeled entry and
          # the direct ref IS the commit. Verified against this repo's live
          # remote: annotated v1.0.0 (3255a115 tag-obj -> a49d99d1 commit),
          # lightweight scratch tag (direct == commit), missing (empty),
          # moved (differs -> mismatch fires).
          # One ls-remote round-trip for both refs: the direct and peeled
          # SHAs then come from the same ref advertisement, so a tag moved
          # between two separate queries cannot split the pair (TOCTOU).
          REMOTE_REFS=$(git ls-remote origin "refs/tags/$TAG" "refs/tags/$TAG^{}")
          DIRECT_SHA=$(printf '%s\n' "$REMOTE_REFS" | awk -v t="refs/tags/$TAG" '$2==t{print $1}')
          if [ -z "$DIRECT_SHA" ]; then
            echo "::error::tag refs/tags/$TAG not found on remote"
            exit 1
          fi
          PEELED_SHA=$(printf '%s\n' "$REMOTE_REFS" | awk -v t="refs/tags/$TAG^{}" '$2==t{print $1}')
          REMOTE_SHA="${PEELED_SHA:-$DIRECT_SHA}"
          if [ "$REMOTE_SHA" != "$GITHUB_SHA" ]; then
            echo "::error::tag/HEAD provenance mismatch: remote tag=$REMOTE_SHA build=$GITHUB_SHA"
            exit 1
          fi
          ZIP="$RUNNER_TEMP/pkg/HermesUsage-${ARTIFACT_LABEL}.zip"
          ls -la "$ZIP"
          gh release create "$TAG" "$ZIP" \
            --title "$TAG" \
            --verify-tag \
            --notes "Signed + notarized + stapled build (Developer ID).

          Verified by CI on this exact commit: codesign --verify --deep --strict, stapler validate, spctl -a -vv (source=Notarized Developer ID).

          Limits (by design): usage numbers are device-wide across profiles, daily attribution is estimated, accessibility is AX-verified only."
          gh release view "$TAG" --json assets,isDraft --jq '{assets: [.assets[].name], isDraft}'

      - name: Cleanup keychain
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/build.keychain" || true
          rm -f "$RUNNER_TEMP/build_certificate.p12"
